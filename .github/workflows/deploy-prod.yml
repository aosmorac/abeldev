name: Deploy Abeldev

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: abeldev-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  SITE_BUCKET: ${{ vars.AWS_SITE_BUCKET }}
  DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
  DISTRIBUTION_DOMAIN: ${{ vars.AWS_CLOUDFRONT_DOMAIN }}
  AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        run: |
          test -n "$SITE_BUCKET"
          test -n "$DISTRIBUTION_ID"
          test -n "$DISTRIBUTION_DOMAIN"
          test -n "$AWS_ROLE_ARN"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        env:
          CI: "true"
        run: npm run build

      - name: Sync immutable assets
        run: |
          aws s3 sync dist/assets "s3://$SITE_BUCKET/assets" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync public files
        run: |
          aws s3 sync dist "s3://$SITE_BUCKET" \
            --delete \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public,max-age=3600"

      - name: Upload entry document
        run: |
          aws s3 cp dist/index.html "s3://$SITE_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        id: invalidation
        run: |
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"
          echo "id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "${{ steps.invalidation.outputs.id }}"

      - name: Smoke test
        working-directory: .
        run: |
          SITE_HTML="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 "https://$DISTRIBUTION_DOMAIN")"
          grep --fixed-strings --quiet "Abel Moreno" <<< "$SITE_HTML"
          SITE_HEADERS="$(curl --fail --silent --show-error --head --retry 8 --retry-delay 5 "https://$DISTRIBUTION_DOMAIN")"
          grep --ignore-case --quiet '^content-security-policy:' <<< "$SITE_HEADERS"
          grep --ignore-case --quiet '^strict-transport-security:' <<< "$SITE_HEADERS"
